# Публикуется только после успешной закрытой приёмки и production deploy.
<VirtualHost *:80>
    ServerName meeting.janickiy.com
    DocumentRoot /var/www/meetrix-acme
    <Directory /var/www/meetrix-acme>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://meeting.janickiy.com%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/meeting-error.log
    CustomLog ${APACHE_LOG_DIR}/meeting-access.log "%a %m %U %>s %D"
</VirtualHost>
<VirtualHost *:443>
    ServerName meeting.janickiy.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/meeting.janickiy.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/meeting.janickiy.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    Protocols h2 http/1.1
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders Off
    RequestHeader unset Forwarded
    RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "meeting.janickiy.com"
    # Public source packages and the installer are separate from the running application.
    ProxyPass /downloads/ !
    Alias /downloads/ /var/www/meetspace-downloads/
    <Directory /var/www/meetspace-downloads>
        Options None
        AllowOverride None
        Require all granted
        SetHandler none
        Header always set X-Content-Type-Options "nosniff"
        <FilesMatch "^(install\.sh(\.sha256)?|source\.json)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        <FilesMatch "\.tar\.gz$">
            ForceType application/gzip
            Header set Cache-Control "public, max-age=31536000, immutable"
            Header set Content-Disposition "attachment"
        </FilesMatch>
        <Files "install.sh">
            ForceType application/octet-stream
            Header set Content-Disposition "attachment; filename=install.sh"
        </Files>
    </Directory>
    ProxyPass / http://127.0.0.1:19080/ upgrade=websocket connectiontimeout=5 timeout=120
    ProxyPassReverse / http://127.0.0.1:19080/
    <Location />
        Require all granted
    </Location>
    ErrorLog ${APACHE_LOG_DIR}/meeting-error.log
    LogLevel crit
    CustomLog ${APACHE_LOG_DIR}/meeting-access.log "%a %m %U %>s %D"
</VirtualHost>
