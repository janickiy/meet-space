<VirtualHost *:443>
    ServerName meet-space.janickiy.com
    DocumentRoot /var/www/meet-space.janickiy.com/current
    DirectoryIndex index.html
    SSLEngine on
    Protocols h2 http/1.1
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/meet-space.janickiy.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/meet-space.janickiy.com/privkey.pem

    <Directory /var/www/meet-space.janickiy.com>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    # Account routes belong to the existing application, including old bookmarks.
    RewriteRule ^/(login|register|app|personal|meetings|conferences)(/.*)?$ https://meeting.janickiy.com%{REQUEST_URI} [R=302,L]
    # Serve the prerendered HTML without forcing a trailing slash.
    RewriteRule ^/$ /index.html [END]
    RewriteCond %{REQUEST_URI} !/index\.html$
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}/index.html -f
    RewriteRule ^/(.+?)/?$ /$1/index.html [END]

    <Files "app.html">
        Require all denied
    </Files>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000"
    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml

    ErrorLog ${APACHE_LOG_DIR}/meet-space-janickiy-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/meet-space-janickiy-ssl-access.log combined
</VirtualHost>
