# Initial HTTP virtual host, also used by automatic certificate renewal.
<VirtualHost *:80>
    ServerName meet-space.janickiy.com
    DocumentRoot /var/www/meet-space.janickiy.com/current

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://meet-space.janickiy.com%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/meet-space-janickiy-http-error.log
    CustomLog ${APACHE_LOG_DIR}/meet-space-janickiy-http-access.log combined
</VirtualHost>
