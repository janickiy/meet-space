# SMTP включено только в приложениях, отправляющих уведомления о продуктах.  Сохраните
# EMAIL_PROVIDER_MODE в общем файле окружения, совместимом с более ранними версиями, на время
# поэтапного обновления.  Учетные данные SMTP остаются в частном файле окружения.
services:
  api:
    environment:
      EMAIL_PROVIDER_MODE: smtp
  product-worker:
    environment:
      EMAIL_PROVIDER_MODE: smtp
