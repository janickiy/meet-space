name: Publish prebuilt server images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable server release version
        required: true
        default: v0.4.0-prebuilt.20261022.1

permissions:
  contents: read

concurrency:
  group: server-images-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate version and create draft
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This release already exists; choose a new immutable version.' >&2
            exit 1
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --draft --prerelease \
            --title "MeetSpace server $VERSION" --notes "Docker images built from $GITHUB_SHA in GitHub Actions."

  build:
    needs: prepare
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Free disposable runner space
        run: |
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /
      - name: Install release tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep jq
      - name: Build and scan immutable Docker images
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
          TRIVY_IMAGE: aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        run: |
          mkdir -p "$RUNNER_TEMP/meetspace-release"
          bash scripts/release/build.sh --version "$VERSION" --commit "$GITHUB_SHA" \
            --registry "meetspace-source-${GITHUB_SHA:0:12}" --layout hardened-shared-host \
            --platform "linux/$ARCH" --output "$RUNNER_TEMP/meetspace-release/build"
          bash scripts/release/package.sh --build "$RUNNER_TEMP/meetspace-release/build/build.json" \
            --mode archive --output "$RUNNER_TEMP/meetspace-release/package"
          python3 -I scripts/release/prebuilt-bundle.py --package "$RUNNER_TEMP/meetspace-release/package" \
            --output "$RUNNER_TEMP/meetspace-release/output"
      - name: Upload verified architecture bundle
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$VERSION" "$RUNNER_TEMP/meetspace-release/output/"*.tar.gz \
            "$RUNNER_TEMP/meetspace-release/output/"*.sha256 \
            "$RUNNER_TEMP/meetspace-release/output/"prebuilt-*.json --repo "$GITHUB_REPOSITORY"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish only after both architectures pass
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/release-index"
          gh release download "$VERSION" --pattern 'prebuilt-*.json' \
            --dir "$RUNNER_TEMP/release-index" --repo "$GITHUB_REPOSITORY"
          python3 -I scripts/release/prebuilt-index.py "$RUNNER_TEMP/release-index" "$VERSION" "$GITHUB_SHA"
          gh release upload "$VERSION" "$RUNNER_TEMP/release-index/prebuilt.json" --repo "$GITHUB_REPOSITORY"
          gh release edit "$VERSION" --draft=false --repo "$GITHUB_REPOSITORY"
