<!doctype html><meta charset="utf-8" /><title>
  MeetSpace microphone gain browser verification
</title>
<pre id="result">running</pre>
<script type="module">
  import { MicrophoneGain, MICROPHONE_GAIN } from "/src/microphoneGain.ts";
  import { ConferenceMediaClient } from "/src/media.ts";
  // A silent rendering sink advances real-time WebAudio without touching speakers.
  const NativeAudioContext = window.AudioContext;
  const createdContexts = [];
  window.AudioContext = class extends NativeAudioContext {
    constructor(options = {}) {
      super({ ...options, sinkId: { type: "none" } });
      createdContexts.push(this);
    }
  };
  const checks = [],
    details = [],
    allContexts = [],
    allTracks = [],
    allGains = [];
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const assert = (condition, name) => {
    checks.push({ name, passed: !!condition });
    if (!condition) throw new Error(name);
  };
  const within = async (test, ms = 1500) => {
    const until = performance.now() + ms;
    while (!test() && performance.now() < until) await wait(10);
    return test();
  };
  let audibleConnections = 0;
  const realConnect = AudioNode.prototype.connect;
  AudioNode.prototype.connect = function (...args) {
    if (args[0] === this.context.destination) audibleConnections++;
    return realConnect.apply(this, args);
  };
  async function source(channels) {
    const context = new AudioContext({ sampleRate: 48000 });
    allContexts.push(context);
    await context.resume();
    const sink = context.createMediaStreamDestination();
    sink.channelCount = channels;
    sink.channelCountMode = "explicit";
    const oscillators = [],
      gains = [];
    const merger = channels > 1 ? context.createChannelMerger(channels) : null;
    for (let channel = 0; channel < channels; channel++) {
      const oscillator = context.createOscillator();
      oscillator.frequency.value = 500 * (channel + 1);
      const gain = context.createGain();
      gain.gain.value = channel ? 0.2 : 0.4;
      oscillator.connect(gain);
      if (merger) gain.connect(merger, 0, channel);
      else gain.connect(sink);
      oscillator.start();
      oscillators.push(oscillator);
      gains.push(gain);
    }
    merger?.connect(sink);
    const track = sink.stream.getAudioTracks()[0];
    allTracks.push(track);
    // Synthetic destinations initially expose default settings until their first
    // render quantum; real getUserMedia resolves after capture configuration.
    if (!(await within(() => track.getSettings().channelCount === channels)))
      throw new Error("Synthetic input channel configuration did not settle");
    return {
      context,
      track,
      sink,
      stop: async () => {
        track.stop();
        oscillators.forEach((x) => x.stop());
        gains.forEach((x) => x.disconnect());
        merger?.disconnect();
        await context.close();
      },
    };
  }
  function analyser(context, track, channels) {
    const input = context.createMediaStreamSource(new MediaStream([track]));
    const splitter = context.createChannelSplitter(channels),
      sink = context.createMediaStreamDestination();
    const analysers = [];
    input.connect(splitter);
    for (let channel = 0; channel < channels; channel++) {
      const analyser = context.createAnalyser();
      analyser.fftSize = 4096;
      analyser.smoothingTimeConstant = 0;
      splitter.connect(analyser, channel);
      analyser.connect(sink);
      analysers.push(analyser);
    }
    return {
      analysers,
      stop: () => {
        input.disconnect();
        splitter.disconnect();
        analysers.forEach((x) => x.disconnect());
        sink.stream.getTracks().forEach((x) => x.stop());
      },
    };
  }
  async function rms(analysers) {
    const sums = analysers.map(() => 0),
      data = new Float32Array(4096);
    for (let i = 0; i < 32; i++) {
      for (let channel = 0; channel < analysers.length; channel++) {
        analysers[channel].getFloatTimeDomainData(data);
        sums[channel] += Math.sqrt(
          data.reduce((sum, x) => sum + x * x, 0) / data.length,
        );
      }
      await wait(10);
    }
    return sums.map((x) => x / 32);
  }
  async function audioCheck(channels) {
    const raw = await source(channels),
      processor = new MicrophoneGain();
    allGains.push(processor);
    const output = await processor.attach(raw.track);
    allTracks.push(output);
    const inputMeter = analyser(raw.context, raw.track, channels),
      outputMeter = analyser(raw.context, output, channels);
    await wait(200);
    const [inputRms, outputRms] = await Promise.all([
      rms(inputMeter.analysers),
      rms(outputMeter.analysers),
    ]);
    const ratios = inputRms.map((x, i) => outputRms[i] / x);
    details.push({
      channels,
      sampleRate: raw.context.sampleRate,
      inputChannels: raw.track.getSettings().channelCount,
      outputChannels: output.getSettings().channelCount,
      contextState: raw.context.state,
      currentTime: raw.context.currentTime,
      sinkId: raw.context.sinkId,
      inputRms,
      outputRms,
      ratios,
      contentHint: output.contentHint,
    });
    assert(
      ratios.every((x) => Math.abs(x - 0.8) < 0.005),
      `${channels}-channel live WebAudio RMS ratio 0.8`,
    );
    assert(
      output.getSettings().channelCount === channels,
      `${channels}-channel microphone preserves advertised channel count`,
    );
    assert(
      output.contentHint === "speech",
      "processed track speech content hint",
    );
    inputMeter.stop();
    outputMeter.stop();
    processor.dispose();
    processor.dispose();
    assert(
      raw.track.readyState === "ended" && output.readyState === "ended",
      "dispose stops raw and processed track",
    );
    assert(
      await within(() => processor.contextState === "closed"),
      "dispose closes processor context",
    );
    await raw.stop();
  }
  async function lifecycleChecks() {
    const raw = await source(1),
      processor = new MicrophoneGain();
    allGains.push(processor);
    const output = await processor.attach(raw.track);
    allTracks.push(output);
    let ended = 0;
    processor.onEnded = () => ended++;
    raw.track.stop();
    raw.track.dispatchEvent(new Event("ended"));
    assert(
      ended === 1 && output.readyState === "ended",
      "capture ended event stops output and notifies once",
    );
    raw.track.dispatchEvent(new Event("ended"));
    assert(
      ended === 1 && (await within(() => processor.contextState === "closed")),
      "ended cleanup removes listener and closes context",
    );
    await raw.stop();
    // Device replacement uses a fresh processor, as in the client capture transaction.
    const firstRaw = await source(1),
      secondRaw = await source(1);
    const first = new MicrophoneGain(),
      second = new MicrophoneGain();
    allGains.push(first, second);
    const firstOutput = await first.attach(firstRaw.track),
      secondOutput = await second.attach(secondRaw.track);
    allTracks.push(firstOutput, secondOutput);
    assert(
      firstOutput.readyState === "live" && secondOutput.readyState === "live",
      "new device processor can start before old one is disposed",
    );
    first.dispose();
    assert(
      firstRaw.track.readyState === "ended" &&
        firstOutput.readyState === "ended" &&
        secondOutput.readyState === "live",
      "replacement disposes old tracks without ending new track",
    );
    second.dispose();
    await firstRaw.stop();
    await secondRaw.stop();
    const deadRaw = await source(1);
    deadRaw.track.stop();
    const invalid = new MicrophoneGain();
    allGains.push(invalid);
    let rejected = false;
    try {
      await invalid.attach(deadRaw.track);
    } catch {
      rejected = true;
    }
    assert(
      rejected &&
        invalid.outputTrack?.readyState === "ended" &&
        (await within(() => invalid.contextState === "closed")),
      "ended input error cleans output and context",
    );
    await deadRaw.stop();
    const failureRaw = await source(1),
      realCreate = AudioContext.prototype.createGain;
    AudioContext.prototype.createGain = function () {
      throw new Error("injected createGain failure");
    };
    const failure = new MicrophoneGain();
    allGains.push(failure);
    rejected = false;
    try {
      await failure.attach(failureRaw.track);
    } catch {
      rejected = true;
    } finally {
      AudioContext.prototype.createGain = realCreate;
    }
    assert(
      rejected &&
        failureRaw.track.readyState === "ended" &&
        (await within(() => failure.contextState === "closed")),
      "node creation error stops capture and closes context",
    );
    await failureRaw.stop();
    const resumeRaw = await source(1),
      realResume = AudioContext.prototype.resume;
    AudioContext.prototype.resume = function () {
      return Promise.reject(new Error("injected resume rejection"));
    };
    const resumeFailure = new MicrophoneGain();
    allGains.push(resumeFailure);
    await createdContexts.at(-1).suspend();
    rejected = false;
    try {
      await resumeFailure.attach(resumeRaw.track);
    } catch {
      rejected = true;
    }
    AudioContext.prototype.resume = realResume;
    assert(
      rejected &&
        resumeRaw.track.readyState === "ended" &&
        resumeFailure.outputTrack?.readyState === "ended" &&
        (await within(() => resumeFailure.contextState === "closed")),
      "resume rejection cleans raw output and context",
    );
    await resumeRaw.stop();
    const duplicateRaw = await source(1),
      extraRaw = await source(1),
      duplicate = new MicrophoneGain();
    allGains.push(duplicate);
    const duplicateOutput = await duplicate.attach(duplicateRaw.track);
    allTracks.push(duplicateOutput);
    rejected = false;
    try {
      await duplicate.attach(extraRaw.track);
    } catch {
      rejected = true;
    }
    assert(
      rejected &&
        duplicateRaw.track.readyState === "ended" &&
        extraRaw.track.readyState === "ended" &&
        duplicateOutput.readyState === "ended" &&
        (await within(() => duplicate.contextState === "closed")),
      "duplicate attach rejects and releases both input tracks",
    );
    await duplicateRaw.stop();
    await extraRaw.stop();
  }
  async function integrationChecks() {
    const mediaDevices = navigator.mediaDevices,
      originalGum = mediaDevices.getUserMedia;
    const clients = [];
    function client() {
      const sent = [];
      const value = new ConferenceMediaClient(
        (type, data) => {
          sent.push({ type, data });
          return String(sent.length);
        },
        () => {},
      );
      clients.push(value);
      return { value, sent };
    }
    try {
      const raw = await source(1),
        captured = raw.track.clone();
      allTracks.push(captured);
      mediaDevices.getUserMedia = async () => new MediaStream([captured]);
      const first = client(),
        contextsBefore = createdContexts.length;
      await first.value.start(true, { cameraEnabled: false });
      const output = first.value.snapshot().localStream?.getAudioTracks()[0];
      assert(
        !!output &&
          output !== captured &&
          output.contentHint === "speech" &&
          first.sent.some((x) => x.type === "media.join"),
        "ConferenceMediaClient publishes processed track instead of raw capture",
      );
      assert(
        createdContexts.length === contextsBefore + 1,
        "microphone start creates exactly one processing context",
      );
      first.value.stop();
      first.value.stop();
      assert(
        captured.readyState === "ended" &&
          output.readyState === "ended" &&
          (await within(() => createdContexts.at(-1).state === "closed")),
        "ConferenceMediaClient stop closes raw output and processing context",
      );
      await raw.stop();
      const rawEnded = await source(1),
        capturedEnded = rawEnded.track.clone();
      allTracks.push(capturedEnded);
      mediaDevices.getUserMedia = async () => new MediaStream([capturedEnded]);
      const ended = client();
      await ended.value.start(true, { cameraEnabled: false });
      const endedOutput = ended.value
        .snapshot()
        .localStream.getAudioTracks()[0];
      capturedEnded.stop();
      capturedEnded.dispatchEvent(new Event("ended"));
      assert(
        !ended.value.snapshot().microphoneEnabled &&
          ended.value.snapshot().localStream === null &&
          endedOutput.readyState === "ended",
        "raw capture ended updates ConferenceMediaClient before server join",
      );
      ended.value.stop();
      await rawEnded.stop();
      const lateRaw = await source(1),
        lateTrack = lateRaw.track.clone();
      allTracks.push(lateTrack);
      let permissionResolve;
      mediaDevices.getUserMedia = () =>
        new Promise((resolve) => {
          permissionResolve = resolve;
        });
      const late = client(),
        pending = late.value.start(true, { cameraEnabled: false });
      const pendingContext = createdContexts.at(-1);
      late.value.stop();
      permissionResolve(new MediaStream([lateTrack]));
      await pending;
      assert(
        lateTrack.readyState === "ended" &&
          !late.value.snapshot().localStream &&
          !late.sent.some((x) => x.type === "media.join") &&
          (await within(() => pendingContext.state === "closed")),
        "stop during pending capture closes late raw track and processing context without joining",
      );
      await lateRaw.stop();
      const failedRaw = await source(1),
        failedTrack = failedRaw.track.clone();
      allTracks.push(failedTrack);
      mediaDevices.getUserMedia = async () => new MediaStream([failedTrack]);
      const realCreate = AudioContext.prototype.createGain;
      AudioContext.prototype.createGain = function () {
        throw new Error("injected processing failure");
      };
      const failure = client();
      try {
        await failure.value.start(true, { cameraEnabled: false });
      } finally {
        AudioContext.prototype.createGain = realCreate;
      }
      assert(
        failedTrack.readyState === "ended" &&
          !failure.value.snapshot().active &&
          !!failure.value.snapshot().error &&
          !failure.sent.some((x) => x.type === "media.join") &&
          (await within(() => createdContexts.at(-1).state === "closed")),
        "processing failure stops captured track and prevents raw fallback publication",
      );
      await failedRaw.stop();
      const beforeNoCapture = createdContexts.length;
      let requests = 0;
      mediaDevices.getUserMedia = async () => {
        requests++;
        throw new Error("unexpected capture");
      };
      const receiveOnly = client();
      await receiveOnly.value.start(false);
      assert(
        requests === 0 &&
          createdContexts.length === beforeNoCapture &&
          receiveOnly.sent.some((x) => x.type === "media.join"),
        "receive-only connection does not acquire microphone or create audio processing",
      );
      receiveOnly.value.stop();
    } finally {
      mediaDevices.getUserMedia = originalGum;
      clients.forEach((x) => x.stop());
    }
  }
  window.micGainVerification = (async () => {
    let error = null;
    try {
      assert(MICROPHONE_GAIN === 0.8, "constant gain is 0.8");
      await audioCheck(1);
      await audioCheck(2);
      await lifecycleChecks();
      await integrationChecks();
      assert(
        audibleConnections === 0,
        "no node connected to speaker destination",
      );
    } catch (e) {
      error = e.stack || String(e);
    } finally {
      allGains.forEach((x) => x.dispose());
      allTracks.forEach((x) => x.stop());
      await Promise.all(
        allContexts
          .filter((x) => x.state !== "closed")
          .map((x) => x.close().catch(() => {})),
      );
      AudioNode.prototype.connect = realConnect;
      window.AudioContext = NativeAudioContext;
    }
    const result = {
      ok: !error,
      browser: navigator.userAgent,
      physicalMicrophoneUsed: false,
      silentAudioSink: true,
      source:
        "synthetic oscillators through live MediaStreamAudioDestinationNode",
      rawEndedTest: "synthetic ended event after track stop",
      audibleConnections,
      checks,
      details,
      error,
    };
    document.getElementById("result").textContent = JSON.stringify(
      result,
      null,
      2,
    );
    return result;
  })();
</script>
